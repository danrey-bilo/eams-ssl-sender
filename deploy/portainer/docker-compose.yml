# EAMS ssl sender — стек для Portainer (Stacks → Add stack → Upload) или для `docker compose up -d`.
#
# Все значения — в .env (Portainer: «Load variables from .env file»). Секреты приходят переменными:
# в Portainer нет файлов секретов на сервере. Подробно — README.md рядом.
#
# Порядок при каждом развёртывании: postgres → migrate (схема, роль базы, первый администратор)
# → api → cloudflared. Обновление образа — новый SENDER_IMAGE и «Update the stack».

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sender
      POSTGRES_USER: sender
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только внутренняя сеть: базе не нужен ни интернет, ни туннель.
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    pids_limit: 256
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sender -d sender"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Одноразовая служба: накатывает схему, заводит роль sender_app (сервис ходит ею — без права
  # менять схему) и, если заданы, первого администратора или сброс доступа. Завершается с кодом 0.
  migrate:
    image: ${SENDER_IMAGE:-ghcr.io/danrey-bilo/email_ssl_sender:latest}
    command: ["migrate"]
    restart: "no"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      SENDER_MASTER_KEK: ${SENDER_MASTER_KEK:?задайте SENDER_MASTER_KEK в .env}
      SENDER_APP_ROLE: sender_app
      SENDER_APP_PASSWORD: ${SENDER_APP_PASSWORD:?задайте SENDER_APP_PASSWORD в .env}
      SENDER_INIT_ADMIN_EMAIL: ${SENDER_INIT_ADMIN_EMAIL:-}
      SENDER_INIT_ADMIN_PASSWORD: ${SENDER_INIT_ADMIN_PASSWORD:-}
      SENDER_RESET_ACCESS_EMAIL: ${SENDER_RESET_ACCESS_EMAIL:-}
      SENDER_RESET_ACCESS_PASSWORD: ${SENDER_RESET_ACCESS_PASSWORD:-}
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    networks:
      - db
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ${SENDER_IMAGE:-ghcr.io/danrey-bilo/email_ssl_sender:latest}
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8001"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender_app;Maximum Pool Size=40;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD: ${SENDER_APP_PASSWORD:?задайте SENDER_APP_PASSWORD в .env}
      SENDER_MASTER_KEK: ${SENDER_MASTER_KEK:?задайте SENDER_MASTER_KEK в .env}
      # Заголовкам X-Forwarded-* верим только от адреса cloudflared (и своего прокси, если задан) — не от
      # всей подсети туннеля: в неё входит и шлюз моста, то есть сам сервер.
      ForwardedHeaders__KnownProxies: ${SENDER_TUNNEL_PROXY_IP:-172.31.250.2}
      ForwardedHeaders__KnownNetworks: ${SENDER_TRUSTED_PROXY_NETWORKS:-}
    <<: *hardening
    read_only: true
    tmpfs:
      - /tmp
    # Наружу — только через туннель; на сервере порт открыт лишь для 127.0.0.1.
    ports:
      - "127.0.0.1:${SENDER_HTTP_PORT:-8001}:8001"
    networks:
      default:
      db:
      edge:
        ipv4_address: ${SENDER_TUNNEL_API_IP:-172.31.250.3}
    cpus: 2
    mem_limit: 1g
    pids_limit: 512
    logging: *logging
    healthcheck:
      test: ["CMD", "dotnet", "EmailSslSender.Api.dll", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Cloudflare Tunnel: публикует панель наружу исходящим соединением, без открытых портов.
  # В Cloudflare сервис туннеля — HTTP `api:8001`.
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?задайте CLOUDFLARE_TUNNEL_TOKEN в .env}
    <<: *hardening
    read_only: true
    networks:
      edge:
        ipv4_address: ${SENDER_TUNNEL_PROXY_IP:-172.31.250.2}
    mem_limit: 256m
    pids_limit: 128
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:

networks:
  default:
  # База и служебные контейнеры. internal: из этой сети нет выхода наружу.
  db:
    internal: true
  # Только туннель и API. Подсеть закреплена, чтобы API верил заголовкам именно от неё.
  edge:
    ipam:
      config:
        - subnet: ${SENDER_TUNNEL_SUBNET:-172.31.250.0/28}
