# Тег vX.Y.Z → образ в ghcr.io и страница релиза с архивами для Portainer и командной строки.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # ⚠ Действия — только по хешу коммита. MODULES_TOKEN — чтение этого репозитория и закрытых module-*.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
          token: ${{ secrets.MODULES_TOKEN }}

      - name: Версия и имя образа
        id: v
        run: |
          echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Тестов здесь нет: тег ставится на проверенный main.

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.v.outputs.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: EmailSslSender.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Версия из тега попадает в журнал при старте.
          build-args: |
            VERSION=${{ steps.v.outputs.version }}

      - name: Файлы релиза
        env:
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
          IMAGE: ${{ steps.v.outputs.image }}
        run: |
          docker pull "$IMAGE:$VERSION"

          # Архив для Portainer, закреплён на версии релиза.
          PKG="email-ssl-sender-$TAG"
          mkdir -p "pkg/$PKG"
          docker save "$IMAGE:$VERSION" -o "pkg/$PKG/email-ssl-sender-image-$TAG.tar"
          sed "s|\${SENDER_IMAGE:-[^}]*}|\${SENDER_IMAGE:-$IMAGE:$VERSION}|" deploy/portainer/docker-compose.yml \
            > "pkg/$PKG/docker-compose.yml"
          sed "s|^SENDER_IMAGE=.*|SENDER_IMAGE=$IMAGE:$VERSION|" deploy/portainer/.env.example > "pkg/$PKG/.env.example"
          sed -e "s|vX\.Y\.Z|$TAG|g" -e "s|:X\.Y\.Z|:$VERSION|g" deploy/portainer/README.md > "pkg/$PKG/README.md"
          cp LICENSE LICENSE.ru.md "pkg/$PKG/"
          (cd pkg && zip -qr "../$PKG.zip" "$PKG")

          # Архив для командной строки.
          mkdir -p "cli/email-ssl-sender/scripts"
          sed "s|\${SENDER_IMAGE:-[^}]*}|\${SENDER_IMAGE:-$IMAGE:$VERSION}|" docker-compose.yml \
            > "cli/email-ssl-sender/docker-compose.yml"
          cp .env.example "cli/email-ssl-sender/.env.example"
          cp LICENSE LICENSE.ru.md "cli/email-ssl-sender/"
          cp scripts/gen-secrets.sh scripts/set-tunnel-token.sh scripts/reset-access.sh "cli/email-ssl-sender/scripts/"
          chmod +x cli/email-ssl-sender/scripts/*.sh
          (cd cli && zip -qr "../email-ssl-sender-cli-$TAG.zip" email-ssl-sender)

          # «Что нового» — раздел версии из CHANGELOG.md.
          awk -v v="$VERSION" '/^## / { show = ($0 == "## " v || index($0, "## " v " ") == 1); next } show' \
            CHANGELOG.md | sed '/./,$!d' > changes.md
          {
            if [ -s changes.md ]; then
              printf '## Что нового\n\n'
              cat changes.md
              printf '\n'
            fi
            sed -e "s|{TAG}|$TAG|g" -e "s|{VERSION}|$VERSION|g" -e "s|{IMAGE}|$IMAGE|g" \
              -e "s|{REPOSITORY}|$GITHUB_REPOSITORY|g" .github/release-notes.md
          } > notes.md

          sha256sum "$PKG.zip" "email-ssl-sender-cli-$TAG.zip" > SHA256SUMS

      - name: Страница релиза
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "EAMS ssl sender $TAG" \
            --notes-file notes.md \
            --verify-tag \
            "email-ssl-sender-$TAG.zip" \
            "email-ssl-sender-cli-$TAG.zip" \
            SHA256SUMS
