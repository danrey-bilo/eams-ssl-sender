# Только для разработки: зависимости для `dotnet run`. docker compose -f docker-compose.dev.yml up -d
# PostgreSQL 127.0.0.1:5432 (пароль `dev`); Mailpit SMTP 127.0.0.1:1025, письма — http://127.0.0.1:8025.
name: email-ssl-sender-dev

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: sender
      POSTGRES_USER: sender
      POSTGRES_PASSWORD: dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sender -d sender"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata-dev:
