# Боевой стек: API (с панелью), PostgreSQL и, по желанию, Cloudflare Tunnel.
#
# Порядок первого запуска (подробно — README.md):
#   ./scripts/gen-secrets.sh
#   ./scripts/set-tunnel-token.sh # токен Cloudflare Tunnel — в файл секрета, не в .env
#   cp .env.example .env
#   docker compose pull           # готовый образ; из исходников — docker compose build
#   docker compose run --rm migrate
#   docker compose run --rm api create-superadmin --email admin@example.com
#   docker compose up -d
#
# ⚠ На сервере публикуется ТОЛЬКО 127.0.0.1:8001. Наружу сервис выходит через Cloudflare Tunnel
# (служба cloudflared ниже: исходящее соединение, открытых портов не нужно) или через свой обратный
# прокси с TLS. Кука обновления помечена Secure и по голому HTTP браузер её не сохранит;
# публиковать 8001 на все адреса без TLS — значит слать пароли открытым текстом.
#
# ⚠ У секретов НЕТ умолчаний: нет файла — нет старта. Файл, по которому поднимают систему, —
# это инструкция, и она исполняется буквально; пароль-умолчание здесь стал бы паролем установки.
name: email-ssl-sender

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    # Готовый образ из релиза (`docker compose pull`); без доступа к реестру compose соберёт его
    # из исходников по `build`. Версию закрепляет SENDER_IMAGE в .env.
    image: ${SENDER_IMAGE:-ghcr.io/danrey-bilo/email_ssl_sender:latest}
    build:
      context: .
      dockerfile: EmailSslSender.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8001"
      # ⚠ `GSS Encryption Mode=Disable`: Npgsql иначе пробует Kerberos, а в обрезанном образе
      # библиотеки libgssapi нет — каждое подключение печатало бы ошибку загрузки.
      # ⚠ ⚠ Сервис ходит ролью sender_app: только чтение и запись строк. Пароля владельца схемы
      # (суперпользователя базы) у этой службы нет вовсе — он есть только у службы migrate.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender_app;Maximum Pool Size=40;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD_FILE: /run/secrets/sender_app_password
      SENDER_MASTER_KEK_FILE: /run/secrets/sender_master_kek
      # Сети, которым верим заголовки X-Forwarded-For / -Proto: сеть туннеля (в ней только
      # cloudflared и сам API) и, если задан, свой обратный прокси. Не верь мы туннелю — все
      # клиенты выглядели бы одним адресом cloudflared, и предел попыток входа делили бы на всех.
      ForwardedHeaders__KnownNetworks: ${SENDER_TUNNEL_SUBNET:-172.31.250.0/28},${SENDER_TRUSTED_PROXY_NETWORKS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - sender_master_kek
      - sender_app_password
    ports:
      - "127.0.0.1:8001:8001"
    # default — выход к SMTP и Key Manager Plus; db — к базе; edge — к туннелю.
    networks:
      - default
      - db
      - edge
    mem_limit: 1g
    pids_limit: 512
    logging: *logging
    healthcheck:
      test: ["CMD", "dotnet", "EmailSslSender.Api.dll", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Схема базы и роль сервиса. Одноразовая служба: docker compose run --rm migrate
  #
  # ⚠ Ходит владельцем схемы (sender — суперпользователь в образе postgres) и единственная знает
  # его пароль. Накатывает миграции и заводит или обновляет роль sender_app с паролем из
  # secrets/sender_app_password: SELECT/INSERT/UPDATE/DELETE, без права менять схему.
  # Профиль tools — чтобы `docker compose up -d` её не запускал.
  migrate:
    image: ${SENDER_IMAGE:-ghcr.io/danrey-bilo/email_ssl_sender:latest}
    profiles: ["tools"]
    command: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD_FILE: /run/secrets/sender_postgres_password
      SENDER_MASTER_KEK_FILE: /run/secrets/sender_master_kek
      SENDER_APP_ROLE: sender_app
      SENDER_APP_PASSWORD_FILE: /run/secrets/sender_app_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - sender_master_kek
      - sender_postgres_password
      - sender_app_password
    networks:
      - db
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  # Cloudflare Tunnel: публикует панель и API наружу исходящим соединением, без открытых портов.
  #
  # ⚠ ⚠ Токен — файлом секрета secrets/cloudflare_tunnel_token (scripts/set-tunnel-token.sh), а не
  # переменной окружения: переменная видна в `docker inspect`, в /proc/1/environ и в
  # `cloudflared --help`, а с токеном любой поднимет второй коннектор того же туннеля и получит
  # часть трафика панели — пароли и коды входа. Служба в профиле `tunnel`; .env.example включает
  # его строкой COMPOSE_PROFILES=tunnel, и тогда обычный `docker compose up -d` поднимает туннель.
  #
  # ⚠ Метрики (и pprof) cloudflared — только на 127.0.0.1 внутри контейнера: по умолчанию они
  # слушают все адреса, и до них дотянулся бы API из общей сети.
  #
  # ⚠ В Cloudflare (Zero Trust → Networks → Tunnels → Public Hostname) сервис указывается как
  # HTTP `api:8001` — имя службы в сети `edge`, а не адрес сервера.
  #
  # Образ — `latest` (решение владельца): обновление — `docker compose pull cloudflared` и
  # `docker compose up -d`. Самообновление внутри контейнера выключено (`--no-autoupdate`).
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      - edge
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sender
      POSTGRES_USER: sender
      POSTGRES_PASSWORD_FILE: /run/secrets/sender_postgres_password
    secrets:
      - sender_postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # ⚠ Только внутренняя сеть db: базе не нужен ни интернет, ни туннель. Возможности — ровно те,
    # что нужны образу postgres, чтобы раздать права каталогу данных и сойти на своего пользователя.
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    pids_limit: 256
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sender -d sender"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  sender_master_kek:
    file: ./secrets/sender_master_kek
  sender_postgres_password:
    file: ./secrets/sender_postgres_password
  sender_app_password:
    file: ./secrets/sender_app_password
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

volumes:
  pgdata:

networks:
  default:
  # База и API. internal: из этой сети нет выхода наружу.
  db:
    internal: true
  # Сеть туннеля: только cloudflared и API — до базы туннелю дороги нет. Подсеть закреплена,
  # чтобы API мог верить заголовкам именно от неё; занята на сервере — задайте SENDER_TUNNEL_SUBNET.
  edge:
    ipam:
      config:
        - subnet: ${SENDER_TUNNEL_SUBNET:-172.31.250.0/28}
