# API с панелью, PostgreSQL и, по желанию, Cloudflare Tunnel. Первый запуск (подробно — README.md):
#   ./scripts/gen-secrets.sh
#   ./scripts/set-tunnel-token.sh # токен туннеля — в файл секрета, не в .env
#   cp .env.example .env
#   docker compose pull api      # образ из Docker Hub; без интернета — docker load из архива релиза
#   docker compose run --rm migrate
#   docker compose run --rm api create-superadmin --email admin@example.com
#   docker compose up -d
#
# ⚠ Публиковать только 127.0.0.1:8001; наружу — туннелем или своим прокси с TLS, не голым HTTP.
# ⚠ У секретов нет умолчаний: нет файла — нет старта.
name: email-ssl-sender

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  api:
    # Образ из Docker Hub; версия — SENDER_IMAGE в .env.
    image: ${SENDER_IMAGE:-danreero/eams-ssl-sender:latest}
    build:
      context: .
      dockerfile: EmailSslSender.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8001"
      # ⚠ Роль sender_app без права менять схему; GSS выключен — в образе нет libgssapi.
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender_app;Maximum Pool Size=40;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD_FILE: /run/secrets/sender_app_password
      SENDER_MASTER_KEK_FILE: /run/secrets/sender_master_kek
      # ⚠ X-Forwarded-* — только от адреса cloudflared (не всей подсети) и своего прокси, если задан.
      ForwardedHeaders__KnownProxies: ${SENDER_TUNNEL_PROXY_IP:-172.31.250.2}
      ForwardedHeaders__KnownNetworks: ${SENDER_TRUSTED_PROXY_NETWORKS:-}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - sender_master_kek
      - sender_app_password
    ports:
      - "127.0.0.1:8001:8001"
    # default — выход к SMTP и Key Manager Plus; db — к базе; edge — к туннелю.
    networks:
      default:
      db:
      edge:
        ipv4_address: ${SENDER_TUNNEL_API_IP:-172.31.250.3}
    # Пределы: argon2 берёт 64 МиБ на хеш.
    cpus: 2
    mem_limit: 1g
    pids_limit: 512
    logging: *logging
    healthcheck:
      test: ["CMD", "dotnet", "EmailSslSender.Api.dll", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy

  # Схема и роль sender_app, разово: docker compose run --rm migrate. Единственная знает пароль владельца.
  migrate:
    image: ${SENDER_IMAGE:-danreero/eams-ssl-sender:latest}
    profiles: ["tools"]
    command: ["migrate"]
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=sender;Username=sender;GSS Encryption Mode=Disable"
      SENDER_POSTGRES_PASSWORD_FILE: /run/secrets/sender_postgres_password
      SENDER_MASTER_KEK_FILE: /run/secrets/sender_master_kek
      SENDER_APP_ROLE: sender_app
      SENDER_APP_PASSWORD_FILE: /run/secrets/sender_app_password
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp
    secrets:
      - sender_master_kek
      - sender_postgres_password
      - sender_app_password
    networks:
      - db
    logging: *logging
    depends_on:
      postgres:
        condition: service_healthy

  # Cloudflare Tunnel (профиль `tunnel`, включается COMPOSE_PROFILES=tunnel в .env).
  # ⚠ Токен — только файлом secrets/cloudflare_tunnel_token (scripts/set-tunnel-token.sh), не переменной.
  # ⚠ В Cloudflare сервис туннеля — HTTP `api:8001`. Метрики — только на 127.0.0.1.
  # Обновление: docker compose pull cloudflared && docker compose up -d.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--metrics", "127.0.0.1:20241", "run"]
    environment:
      TUNNEL_TOKEN_FILE: /run/secrets/cloudflare_tunnel_token
    secrets:
      - cloudflare_tunnel_token
    networks:
      edge:
        ipv4_address: ${SENDER_TUNNEL_PROXY_IP:-172.31.250.2}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    mem_limit: 256m
    pids_limit: 128
    logging: *logging
    depends_on:
      api:
        condition: service_healthy

  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: sender
      POSTGRES_USER: sender
      POSTGRES_PASSWORD_FILE: /run/secrets/sender_postgres_password
    secrets:
      - sender_postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Только внутренняя сеть db; возможности — минимум для образа postgres.
    networks:
      - db
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    mem_limit: 1g
    pids_limit: 256
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sender -d sender"]
      interval: 5s
      timeout: 5s
      retries: 20

secrets:
  sender_master_kek:
    file: ./secrets/sender_master_kek
  sender_postgres_password:
    file: ./secrets/sender_postgres_password
  sender_app_password:
    file: ./secrets/sender_app_password
  cloudflare_tunnel_token:
    file: ./secrets/cloudflare_tunnel_token

volumes:
  pgdata:

networks:
  default:
  # База и API, без выхода наружу.
  db:
    internal: true
  # Туннель: cloudflared и API. Подсеть занята — задайте SENDER_TUNNEL_SUBNET, SENDER_TUNNEL_PROXY_IP и SENDER_TUNNEL_API_IP.
  edge:
    ipam:
      config:
        - subnet: ${SENDER_TUNNEL_SUBNET:-172.31.250.0/28}
