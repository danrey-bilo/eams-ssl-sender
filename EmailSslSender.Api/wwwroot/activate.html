<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Email SSL Sender — активация</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
  form { width: min(360px, calc(100vw - 32px)); display: grid; gap: 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  input, button { font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid GrayText; }
  button { cursor: pointer; }
  .muted { color: GrayText; font-size: 14px; margin: 0; }
  .error { color: #c62828; margin: 0; min-height: 1.2em; }
  .ok { color: #2e7d32; margin: 0; }
</style>
</head>
<body>
<!--
  Страница ссылки из приглашения: /activate#token=…

  ⚠ Токен приходит во ФРАГМЕНТЕ адреса и сразу убирается из адресной строки: фрагмент не
  уходит на сервер с запросом страницы и не оседает в логах прокси, а убранный — не останется
  в истории вкладки. no-referrer — чтобы адрес не уехал ни с одним переходом.
-->
<form id="form" autocomplete="off">
  <h1>Email SSL Sender</h1>
  <p class="muted" id="who">Проверяю ссылку…</p>
  <input id="password" type="password" placeholder="Новый пароль" autocomplete="new-password" required disabled>
  <input id="repeat" type="password" placeholder="Повторите пароль" autocomplete="new-password" required disabled>
  <p class="muted" id="rules"></p>
  <button id="submit" type="submit" disabled>Задать пароль</button>
  <p class="error" id="error" role="alert"></p>
</form>
<script>
  const token = new URLSearchParams(location.hash.slice(1)).get('token') || '';
  history.replaceState(null, '', location.pathname);

  const $ = id => document.getElementById(id);
  const fail = text => { $('error').textContent = text; };

  function rulesText(p) {
    const parts = ['не короче ' + p.min_length + ' символов'];
    if (p.require_uppercase) parts.push('заглавная буква');
    if (p.require_lowercase) parts.push('строчная буква');
    if (p.require_digit) parts.push('цифра');
    if (p.require_symbol) parts.push('спецсимвол');
    return 'Пароль: ' + parts.join(', ') + '.';
  }

  async function load() {
    if (!token) { $('who').textContent = ''; return fail('В ссылке нет токена.'); }
    const r = await fetch('/api/activation?token=' + encodeURIComponent(token), { cache: 'no-store' });
    if (!r.ok) {
      $('who').textContent = '';
      return fail('Ссылка недействительна или уже использована. Попросите администратора прислать новую.');
    }
    const info = await r.json();
    $('who').textContent = info.email;
    $('rules').textContent = rulesText(info.policy);
    for (const id of ['password', 'repeat', 'submit']) $(id).disabled = false;
  }

  $('form').addEventListener('submit', async event => {
    event.preventDefault();
    fail('');
    if ($('password').value !== $('repeat').value) return fail('Пароли не совпадают.');
    $('submit').disabled = true;
    const r = await fetch('/api/activation', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ token, password: $('password').value }),
    });
    if (r.ok) {
      $('form').innerHTML = '<h1>Email SSL Sender</h1><p class="ok">Пароль задан. Войдите в систему; '
        + 'первый вход попросит подключить приложение-аутентификатор.</p>';
      return;
    }
    const body = await r.json().catch(() => null);
    $('submit').disabled = false;
    fail((body && body.message) || 'Не получилось. Попробуйте ещё раз.');
  });

  load().catch(() => fail('Сервер недоступен.'));
</script>
</body>
</html>
